[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]

; Chamadas diretas e de saída. O arquivo é gravado somente enquanto os canais
; estão em bridge; o handler garante o flush mesmo se a origem desligar antes.
[record-and-dial]
exten = s,1,Set(RECORDING_ID=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same = n,Set(RECORDING_FILE=/var/spool/asterisk/monitor/${RECORDING_ID}.wav)
 same = n,Set(OMNI_CALL_ID=${UNIQUEID})
 same = n,Set(OMNI_LINKED_ID=${CHANNEL(linkedid)})
 same = n,Set(OMNI_STARTED_AT_MS=$[${EPOCH} * 1000])
 same = n,Set(OMNI_DIRECTION=${ARG3})
 same = n,Set(OMNI_FROM_NUMBER=${CALLERID(num)})
 same = n,Set(OMNI_TO_NUMBER=${ARG4})
 same = n,Set(OMNI_EXTENSION=${ARG5})
 same = n,Set(OMNI_PROVIDER=${ARG6})
 same = n,Set(CHANNEL(hangup_handler_push)=recording-finished,s,1())
 same = n,MixMonitor(${RECORDING_FILE},b)
 same = n,UserEvent(OmniRecordingStarted,RecordingId:${RECORDING_ID},CallId:${OMNI_CALL_ID},LinkedId:${OMNI_LINKED_ID},Direction:${OMNI_DIRECTION},FromNumber:${OMNI_FROM_NUMBER},ToNumber:${OMNI_TO_NUMBER},Extension:${OMNI_EXTENSION},Provider:${OMNI_PROVIDER},StartedAtMs:${OMNI_STARTED_AT_MS})
 same = n,Dial(${ARG1},${ARG2})
 same = n,Set(OMNI_FINAL_STATUS=${DIALSTATUS})
 same = n,Set(OMNI_DURATION_MS=${ANSWEREDTIME_MS})
 same = n,Return()

; Entrada por fila. MEMBERINTERFACE identifica o ramal que atendeu para que a
; gravação e a transcrição sejam vinculadas ao colaborador correto.
[record-and-queue]
exten = s,1,Set(RECORDING_ID=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same = n,Set(RECORDING_FILE=/var/spool/asterisk/monitor/${RECORDING_ID}.wav)
 same = n,Set(OMNI_CALL_ID=${UNIQUEID})
 same = n,Set(OMNI_LINKED_ID=${CHANNEL(linkedid)})
 same = n,Set(OMNI_STARTED_AT_MS=$[${EPOCH} * 1000])
 same = n,Set(OMNI_DIRECTION=inbound)
 same = n,Set(OMNI_FROM_NUMBER=${CALLERID(num)})
 same = n,Set(OMNI_TO_NUMBER=${ARG2})
 same = n,Set(OMNI_EXTENSION=)
 same = n,Set(OMNI_PROVIDER=${ARG3})
 same = n,Set(CHANNEL(hangup_handler_push)=recording-finished,s,1())
 same = n,MixMonitor(${RECORDING_FILE},b)
 same = n,Queue(${ARG1},t,,,${ARG4})
 same = n,Set(OMNI_EXTENSION=${CUT(CUT(MEMBERINTERFACE,/,2),-,1)})
 same = n,Set(OMNI_FINAL_STATUS=${QUEUESTATUS})
 same = n,Set(OMNI_DURATION_MS=$[${CDR(billsec)} * 1000])
 same = n,Return()

[recording-finished]
exten = s,1,StopMixMonitor()
 same = n,ExecIf($["${OMNI_EXTENSION}"=""]?Set(OMNI_EXTENSION=${CUT(CUT(MEMBERINTERFACE,/,2),-,1)}))
 same = n,ExecIf($["${OMNI_FINAL_STATUS}"=""]?Set(OMNI_FINAL_STATUS=${IF($["${DIALSTATUS}"!=""]?${DIALSTATUS}:${QUEUESTATUS})}))
 same = n,ExecIf($["${OMNI_DURATION_MS}"=""]?Set(OMNI_DURATION_MS=$[${CDR(billsec)} * 1000]))
 same = n,Set(OMNI_ENDED_AT_MS=$[${EPOCH} * 1000])
 same = n,Set(OMNI_ANSWERED_AT_MS=$[${OMNI_ENDED_AT_MS} - ${OMNI_DURATION_MS}])
 same = n,UserEvent(OmniRecordingFinished,RecordingId:${RECORDING_ID},CallId:${OMNI_CALL_ID},LinkedId:${OMNI_LINKED_ID},Direction:${OMNI_DIRECTION},FromNumber:${OMNI_FROM_NUMBER},ToNumber:${OMNI_TO_NUMBER},Extension:${OMNI_EXTENSION},Provider:${OMNI_PROVIDER},DialStatus:${OMNI_FINAL_STATUS},DurationMs:${OMNI_DURATION_MS},StartedAtMs:${OMNI_STARTED_AT_MS},AnsweredAtMs:${OMNI_ANSWERED_AT_MS},EndedAtMs:${OMNI_ENDED_AT_MS})
 same = n,Return()

[from-internal]
exten = _10XX,1,NoOp(Chamada interna ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${EXTEN},30,internal,${EXTEN},${CALLERID(num)},internal))
 same = n,Hangup()

; DirectCall exige formato internacional brasileiro: 55 + DDD + número.
exten = _55[1-9]X[2-9]XXXXXXX,1,NoOp(Saída DirectCall ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${EXTEN}@directcall,60,outbound,${EXTEN},${CALLERID(num)},directcall))
 same = n,Hangup()

exten = _55[1-9]X9XXXXXXXX,1,NoOp(Saída DirectCall ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${EXTEN}@directcall,60,outbound,${EXTEN},${CALLERID(num)},directcall))
 same = n,Hangup()

; O discador usa *8 antes do número para escolher voz pelo WhatsApp.
exten = _*855[1-9]X[2-9]XXXXXXX,1,Set(WAVOIP_DESTINATION=${EXTEN:2})
 same = n,NoOp(Saída WaVoIP ${CALLERID(num)} -> ${WAVOIP_DESTINATION})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${WAVOIP_DESTINATION}@wavoip,60,outbound,${WAVOIP_DESTINATION},${CALLERID(num)},wavoip))
 same = n,Hangup()

exten = _*855[1-9]X9XXXXXXXX,1,Set(WAVOIP_DESTINATION=${EXTEN:2})
 same = n,NoOp(Saída WaVoIP ${CALLERID(num)} -> ${WAVOIP_DESTINATION})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${WAVOIP_DESTINATION}@wavoip,60,outbound,${WAVOIP_DESTINATION},${CALLERID(num)},wavoip))
 same = n,Hangup()

; O prefixo *9 seleciona explicitamente a Twilio. A Twilio exige o sinal +
; no Request-URI e um Caller ID verificado na conta.
exten = _*955[1-9]X[2-9]XXXXXXX,1,Set(TWILIO_DESTINATION=${EXTEN:2})
 same = n,Set(OMNI_ORIGIN_EXTENSION=${CALLERID(num)})
 same = n,NoOp(Saida Twilio ${TWILIO_CALLER_ID} -> +${TWILIO_DESTINATION})
 same = n,Set(CALLERID(num)=${TWILIO_CALLER_ID})
 same = n,Gosub(record-and-dial,s,1(PJSIP/+${TWILIO_DESTINATION}@twilio,60,outbound,${TWILIO_DESTINATION},${OMNI_ORIGIN_EXTENSION},twilio))
 same = n,Hangup()

exten = _*955[1-9]X9XXXXXXXX,1,Set(TWILIO_DESTINATION=${EXTEN:2})
 same = n,Set(OMNI_ORIGIN_EXTENSION=${CALLERID(num)})
 same = n,NoOp(Saida Twilio ${TWILIO_CALLER_ID} -> +${TWILIO_DESTINATION})
 same = n,Set(CALLERID(num)=${TWILIO_CALLER_ID})
 same = n,Gosub(record-and-dial,s,1(PJSIP/+${TWILIO_DESTINATION}@twilio,60,outbound,${TWILIO_DESTINATION},${OMNI_ORIGIN_EXTENSION},twilio))
 same = n,Hangup()

; O prefixo *7 seleciona a Nvoip sem alterar os demais troncos.
exten = _*755[1-9]X[2-9]XXXXXXX,1,Set(NVOIP_DESTINATION=${EXTEN:2})
 same = n,Set(OMNI_ORIGIN_EXTENSION=${CALLERID(num)})
 same = n,NoOp(Saida Nvoip ${CALLERID(num)} -> ${NVOIP_DESTINATION})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${NVOIP_DESTINATION}@nvoip,60,outbound,${NVOIP_DESTINATION},${OMNI_ORIGIN_EXTENSION},nvoip))
 same = n,Hangup()

exten = _*755[1-9]X9XXXXXXXX,1,Set(NVOIP_DESTINATION=${EXTEN:2})
 same = n,Set(OMNI_ORIGIN_EXTENSION=${CALLERID(num)})
 same = n,NoOp(Saida Nvoip ${CALLERID(num)} -> ${NVOIP_DESTINATION})
 same = n,Gosub(record-and-dial,s,1(PJSIP/${NVOIP_DESTINATION}@nvoip,60,outbound,${NVOIP_DESTINATION},${OMNI_ORIGIN_EXTENSION},nvoip))
 same = n,Hangup()

exten = i,1,Playback(invalid)
 same = n,Hangup()

[from-directcall]
; A DirectCall entrega chamadas do DID usando o login SIP como extensão de
; entrada. Esta rota exata mantém o contexto restrito à credencial configurada.
exten = ${SIP_USERNAME},1,NoOp(Entrada DirectCall ${CALLERID(num)} -> ${SIP_PHONE_NUMBER})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},${SIP_PHONE_NUMBER},directcall,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

; Alguns SBCs entregam o próprio DID numérico no Request-URI.
exten = _X.,1,NoOp(Entrada DirectCall DID ${EXTEN})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},${EXTEN},directcall,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

[from-wavoip]
exten = _X.,1,NoOp(Entrada WaVoIP ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},${EXTEN},wavoip,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

exten = s,1,NoOp(Entrada WaVoIP ${CALLERID(num)})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},s,wavoip,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

[from-twilio]
exten = _X.,1,NoOp(Entrada Twilio ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},${EXTEN},twilio,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

[from-nvoip]
exten = _X.,1,NoOp(Entrada Nvoip ${CALLERID(num)} -> ${EXTEN})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},${EXTEN},nvoip,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()

exten = s,1,NoOp(Entrada Nvoip ${CALLERID(num)})
 same = n,Gosub(record-and-queue,s,1(${ASTERISK_QUEUE_NAME},s,nvoip,${ASTERISK_QUEUE_MAX_WAIT}))
 same = n,Hangup()
